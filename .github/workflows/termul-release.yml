# Termul's fork release: builds only the web bundle with the Termul brand and publishes
# figcraft-web-<tag>.zip plus SHA256SUMS.txt to the GitHub release of a `termul-*` tag.
# Upstream's release.yml (storytold/craft-common-actions) is not used here.
#
# Run it by hand (workflow_dispatch) for a dry build: it builds, checks the zip and uploads it as a
# workflow artifact, and never touches releases.
name: Termul release

on:
  push:
    tags: ["termul-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag stamped into host.describe and the asset names for this dry build (no release is made)"
        type: string
        default: "termul-dryrun"

permissions:
  contents: read

concurrency:
  group: termul-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TRUNK_VERSION: "0.21.14"
  WASM_BINDGEN_VERSION: "0.2.129"
  BINARYEN_VERSION: "123"
  FIGCRAFT_BRAND_NAME: "Termul Canvas"
  # Same pin as release.yml and ci.yml. It must be a commit with fonts/latin-manifest.txt (Inter):
  # the wasm build embeds nothing without Inter and text then has no width.
  CRAFT_FONTS_REF: "37827adc41fd165f9a9234ac40f94dbad353aa69"
  CRAFT_FONTS_REQUIRED: "1"

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Resolve and validate the tag
        env:
          RAW_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RAW_TAG" =~ ^termul-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::tag '$RAW_TAG' must match termul-[A-Za-z0-9._-]+"
            exit 1
          fi
          echo "TAG=$RAW_TAG" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: termul-web
          cache-on-failure: true

      - name: Install trunk, wasm-bindgen and wasm-opt
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/bin" "$tools/dl"
          cd "$tools/dl"
          base_trunk="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          base_wb="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}"
          base_bin="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}"
          trunk_tgz="trunk-x86_64-unknown-linux-gnu.tar.gz"
          wb_dir="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          bin_dir="binaryen-version_${BINARYEN_VERSION}"
          curl -fsSLO "$base_trunk/$trunk_tgz"
          curl -fsSLO "$base_wb/$wb_dir.tar.gz"
          curl -fsSLO "$base_bin/$bin_dir-x86_64-linux.tar.gz"
          sha256sum -c - <<'EOF'
          f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  trunk-x86_64-unknown-linux-gnu.tar.gz
          82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  binaryen-version_123-x86_64-linux.tar.gz
          EOF
          tar -xzf "$trunk_tgz" -C "$tools/bin" trunk
          tar -xzf "$wb_dir.tar.gz"
          cp "$wb_dir/wasm-bindgen" "$tools/bin/"
          tar -xzf "$bin_dir-x86_64-linux.tar.gz"
          cp "$bin_dir/bin/wasm-opt" "$tools/bin/"
          echo "$tools/bin" >> "$GITHUB_PATH"
          PATH="$tools/bin:$PATH"
          trunk --version
          wasm-bindgen --version
          wasm-opt --version

      - name: Build the web bundle, enforce the 24.5 MiB wasm gate and zip
        env:
          DIST: ${{ runner.temp }}/release
          # package.sh keeps a .wasm under 24 MiB for Cloudflare's 25 MiB per-file cap. This bundle
          # never goes to Cloudflare: Termul downloads it from this repository's GitHub release,
          # embeds it in its own binary and serves it from its own server (termul
          # src-tauri/build.rs, src-tauri/src/canvas/static_server.rs). 24.5 MiB keeps the gate as a
          # check on growth, below that cap.
          FIGCRAFT_WASM_MAX_BYTES: "25690112"
        run: |
          set -euo pipefail
          export FIGCRAFT_VERSION="$TAG" FIGCRAFT_HOST_TAG="$TAG"
          packaging/web/package.sh

      - name: Check the zip layout and the stamped tag
        env:
          DIST: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          zip="$DIST/figcraft-web-$TAG.zip"
          root="figcraft-web-$TAG"
          entries="$(unzip -Z1 "$zip")"
          bad="$(grep -v "^$root/" <<<"$entries" || true)"
          [ -z "$bad" ] || { echo "::error::entries outside $root/: $bad"; exit 1; }
          grep -qx "$root/index.html" <<<"$entries" || { echo "::error::$root/index.html missing"; exit 1; }
          wasm="$(grep -E "^$root/figcraft-web-.*_bg\.wasm$" <<<"$entries" || true)"
          [ -n "$wasm" ] || { echo "::error::wasm missing"; exit 1; }
          unzip -p "$zip" "$wasm" | grep -aF "$TAG" >/dev/null \
            || { echo "::error::FIGCRAFT_HOST_TAG '$TAG' is not stamped into the wasm"; exit 1; }
          unzip -p "$zip" "$wasm" | grep -aF "$FIGCRAFT_BRAND_NAME" >/dev/null \
            || { echo "::error::brand '$FIGCRAFT_BRAND_NAME' is not in the wasm"; exit 1; }
          unzip -p "$zip" "$root/index.html" | grep -F "<title>$FIGCRAFT_BRAND_NAME</title>" >/dev/null \
            || { echo "::error::brand '$FIGCRAFT_BRAND_NAME' is not the <title> of index.html"; exit 1; }
          unzip -p "$zip" "$root/index.html" | grep -F "Loading $FIGCRAFT_BRAND_NAME&hellip;" >/dev/null \
            || { echo "::error::brand '$FIGCRAFT_BRAND_NAME' is not in the loading text of index.html"; exit 1; }
          # Inter's name table is UTF-16BE, so this only matches font bytes, not a "Inter" string literal.
          unzip -p "$zip" "$wasm" | LC_ALL=C grep -aP '\x00I\x00n\x00t\x00e\x00r\x00 \x00P\x00r\x00o\x00j\x00e\x00c\x00t' >/dev/null \
            || { echo "::error::craft-fonts (Inter) is not embedded in the wasm; text would have no width"; exit 1; }
          grep -qx "$root/OFL-inter.txt" <<<"$entries" \
            || { echo "::error::$root/OFL-inter.txt missing; the OFL requires the licence to travel with the font"; exit 1; }
          echo "$entries"

      - name: Write SHA256SUMS.txt
        env:
          DIST: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          cd "$DIST"
          sha256sum "figcraft-web-$TAG.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termul-web-release
          path: |
            ${{ runner.temp }}/release/figcraft-web-*.zip
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termul-web-release
          path: release

      - name: Create the release if missing and upload the assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Termul Canvas web bundle built from $GITHUB_SHA."
          fi
          gh release upload "$TAG" "release/figcraft-web-$TAG.zip" release/SHA256SUMS.txt --clobber
